name: Build Windows exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pillow pyinstaller
      - name: Build JpgRotator.exe
        run: python -m PyInstaller --onefile --windowed --name JpgRotator jpg_rotator.py
      - name: Smoke test rotation logic
        run: python -c "import rotate_core, tempfile, os; from PIL import Image; d=tempfile.mkdtemp(); i=os.path.join(d,'in'); os.makedirs(i); Image.new('RGB',(20,10)).save(os.path.join(i,'x.jpg')); s=rotate_core.process(i, os.path.join(d,'out'), 7, print); assert s['created']==1, s"
      - uses: actions/upload-artifact@v4
        with:
          name: JpgRotator-exe
          path: dist/JpgRotator.exe
